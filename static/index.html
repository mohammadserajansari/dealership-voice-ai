<!DOCTYPE html>
<html>
<head>
    <title>Auto Dealership Voice AI</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --container-bg: #1e293b;
            --user-bubble: #3b82f6;
            --bot-bubble: #334155;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: var(--container-bg);
            padding: 24px;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            height: 80vh;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #334155;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        h2 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }

        .reset-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover { background: #ef4444; color: white; }

        /* Chat History - ChatGPT Style */
        #chat-history {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }

        #chat-history::-webkit-scrollbar { width: 6px; }
        #chat-history::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .msg {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            max-width: 85%;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg {
            align-self: flex-end;
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            align-self: flex-start;
            background: var(--bot-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .msg-label {
            font-size: 10px;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        /* Interaction Area */
        .controls {
            padding-top: 15px;
            border-top: 1px solid #334155;
        }

        #mic-btn {
            width: 64px; height: 64px;
            border-radius: 50%; border: none;
            background: var(--user-bubble); color: white;
            font-size: 24px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        #mic-btn.recording {
            background: #ef4444;
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        #status {
            margin-top: 12px; color: var(--text-dim);
            font-size: 12px; font-weight: 500;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚗 <span style="color:var(--accent)">Dealer</span>AI</h2>
        <button class="reset-btn" id="reset-btn">NEW CHAT</button>
    </div>
    
    <div id="chat-history">
        <div class="msg bot-msg">
            <span class="msg-label">Assistant</span>
            Hello! I'm your AI dealership assistant. Tap the mic to start booking your test drive.
        </div>
    </div>

    <div class="controls">
        <button id="mic-btn">🎤</button>
        <div id="status">Tap to speak</div>
    </div>
</div>

<script>
let mediaRecorder;
let audioChunks = [];
let stream = null;
let sessionId = localStorage.getItem('voice_session_id') || null;

const btn = document.getElementById("mic-btn");
const resetBtn = document.getElementById("reset-btn");
const status = document.getElementById("status");
const chatHistory = document.getElementById("chat-history");

/**
 * Adds a chat bubble to the UI
 */
function addMessage(text, isUser = false) {
    if(!text) return;
    const msgDiv = document.createElement("div");
    msgDiv.className = `msg ${isUser ? 'user-msg' : 'bot-msg'}`;
    
    const label = document.createElement("span");
    label.className = "msg-label";
    label.innerText = isUser ? "You" : "Assistant";
    
    const content = document.createElement("span");
    content.innerText = text;

    msgDiv.appendChild(label);
    msgDiv.appendChild(content);
    chatHistory.appendChild(msgDiv);
    
    // Smooth scroll to bottom
    chatHistory.scrollTo({ top: chatHistory.scrollHeight, behavior: 'smooth' });
}

resetBtn.onclick = async () => {
    if(!sessionId) return;
    try {
        await fetch("http://localhost:8000/reset_session", {
            method: "POST",
            headers: { "X-Session-ID": sessionId }
        });
        chatHistory.innerHTML = `
            <div class="msg bot-msg">
                <span class="msg-label">Assistant</span>
                Memory cleared. How can I help you today?
            </div>`;
        status.innerText = "Session Reset";
        setTimeout(() => { status.innerText = "Tap to speak"; }, 2000);
    } catch (err) {
        console.error("Reset failed", err);
    }
};

async function initMic() {
    if (!stream) {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (err) {
            status.innerText = "Mic Error: Check permissions";
        }
    }
}

btn.onclick = async () => {
    await initMic();
    if (!stream) return;

    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btn.classList.remove("recording");
        status.innerText = "Processing audio...";
        return;
    }

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

    mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: "audio/wav" });
        const formData = new FormData();
        formData.append("file", blob);

        try {
            const headers = {};
            if (sessionId) headers["X-Session-ID"] = sessionId;

            // Start thinking state
            status.innerText = "Thinking...";

            const response = await fetch("http://localhost:8000/voice_chat", {
                method: "POST",
                body: formData,
                headers
            });

            if (!response.ok) throw new Error("Server error");

            // Update Session ID
            const sid = response.headers.get("X-Session-ID");
            if (sid) {
                sessionId = sid;
                localStorage.setItem('voice_session_id', sid);
            }

            // Decode and display User message
            const userEncoded = response.headers.get("X-User-Transcript");
            if (userEncoded) {
                const userText = atob(userEncoded);
                addMessage(userText, true);
            }

            // Decode and display Bot message
            const botEncoded = response.headers.get("X-Transcript");
            if (botEncoded) {
                const botText = atob(botEncoded);
                addMessage(botText, false);
            }

            // Play the streaming audio response
            const audioBlob = await response.blob();
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            
            status.innerText = "Speaking...";
            audio.play();
            audio.onended = () => { status.innerText = "Tap to speak"; };

        } catch (err) {
            console.error(err);
            status.innerText = "Error contacting server";
            addMessage("Sorry, I'm having trouble connecting right now.", false);
        }
    };

    mediaRecorder.start();
    btn.classList.add("recording");
    status.innerText = "Listening...";
};
</script>
</body>
</html>
