services:
  dealership-ai:
    build: .
    image: dealership-ai
    container_name: dealership-ai
    ports:
      - "80:8000"
    env_file:
      - .env
    restart: always
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
